components:

  schemas:

    FieldPath:
      description: IDOL field path, for example `DOCUMENT/AUTHOR`
      type: string

    SortParam:
      description: How to order documents by field value
      type: string
      enum:
        - "Off"
        - Alphabetical
        - Date
        - DocumentCount
        - NumberDecreasing
        - NumberIncreasing
        - ReverseAlphabetical
        - ReverseDate
        - ReverseDocumentCount

    FieldTypeParam:
      description: IDOL field type
      type: string
      enum:
        - ACL
        - All
        - AlwaysMatch
        - AutnRank
        - BitField
        - DataBase
        - Date
        - DocumentTracking
        - ExpireDate
        - FieldCheck
        - FlattenIndex
        - GeospatialUnified
        - GeospatialX
        - GeospatialY
        - Highlight
        - Index
        - IndexWeight
        - InvertedAgent
        - Language
        - Match
        - NumericDate
        - Numeric
        - Parametric
        - Print
        - Reference
        - SectionBreak
        - Security
        - Sort
        - Source
        - Synonym
        - Title

    QueryType:
      description: |
        How IDOL should interpret the query text.

        - `RAW`: query Content directly
        - `MODIFIED`: send the query to QMS
        - `PROMOTIONS`: send the query to QMS, and also ask for promotions
      type: string
      enum:
        - RAW
        - MODIFIED
        - PROMOTIONS
