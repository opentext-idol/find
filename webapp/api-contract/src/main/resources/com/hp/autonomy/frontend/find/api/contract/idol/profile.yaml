pathItems:

  profileTerms:
    get:
      summary: Get the profile terms for the current user
      description: |
        Returns the agent profiles IDOL Community holds for the authenticated user.
      operationId: getProfileTerms
      tags:
        - profile
      responses:
        '200':
          description: The user's profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profiles"

components:

  schemas:

    Profiles:
      description: An IDOL Community `ProfileRead` response
      type: object
      properties:
        numprofiles:
          type: integer
          format: int32
        totalprofiles:
          type: integer
          format: int32
        profile:
          type: array
          items:
            $ref: "#/components/schemas/Profile"

    Profile:
      description: One interest profile
      type: object
      properties:
        pid:
          type: string
        namedarea:
          type: string
        parent:
          type: string
        parentusername:
          type: string
        numterms:
          type: integer
          format: int32
        score:
          type: integer
          format: int32
        created:
          type: string
          format: date-time
        term:
          type: array
          items:
            $ref: "#/components/schemas/Term"

    Term:
      description: One weighted term of an interest profile
      type: object
      properties:
        value:
          type: string
        weight:
          type: integer
          format: int32
