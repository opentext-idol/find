pathItems:

  exportCsv:
    post:
      summary: Export query results as a CSV file
      operationId: exportCsv
      tags:
        - csvExport
      parameters:
        - name: queryRequest
          in: query
          description: The query whose results to export, as JSON
          required: true
          schema:
            type: string
        - name: selectedFieldIds
          in: query
          description: IDs of the document fields to include as CSV columns, repeated once per field.
          required: false
          explode: true
          style: form
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: |
            The CSV file, with a `Content-Disposition` header naming it `query-results.csv`.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '500':
          description: Export failed; an HTML error page is returned
          content:
            text/html:
              schema:
                type: string

  exportPptxTopicMap:
    post:
      summary: Render a topic map as a PowerPoint file
      operationId: exportPptxTopicMap
      tags:
        - powerpointExport
      parameters:
