pathItems:

  entitySearch:
    get:
      summary: Look up the single best-matching entity document
      description: |
        Queries the configured entity-search database.  Fails if entity search is disabled.
      operationId: searchEntities
      tags:
        - entitySearch
      parameters:
        - name: text
          in: query
          description: The entity text to look up
          required: true
          schema:
            type: string
        - name: databaseGroup
          in: query
          description: Named group of databases to restrict to, from the entity search config
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The matching entity document, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdolSearchResultsResponse"

components:

  schemas:

    IdolSearchResultsResponse:
      description: Entity search results
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "search.yaml#/components/schemas/SearchResult"
