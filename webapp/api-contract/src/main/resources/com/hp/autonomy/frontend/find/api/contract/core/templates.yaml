pathItems:

  resultTemplates:
    get:
      summary: Get the customisable templates
      description: This operation needs no credentials.
      operationId: getResultTemplates
      tags:
        - templates
      security: []
      responses:
        '200':
          description: Mustache template sources, keyed by name
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
