pathItems:

  typeahead:
    get:
      summary: Get query-completion suggestions for a partial query
      operationId: getSuggestions
      tags:
        - typeahead
      parameters:
        - name: text
          in: query
          description: The partial query text to complete
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"

components:

  schemas:

    SuggestionsResponse:
      description: Query-completion suggestions
      type: object
      required:
        - suggestions
      properties:
        suggestions:
          description: Suggested completions, best first
          type: array
          items:
            type: string
