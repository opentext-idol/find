pathItems:

  styleSheet:
    get:
      summary: Get the user-customisable application stylesheet
      description: |
        This operation needs no credentials.
      operationId: getStyleSheet
      tags:
        - style
      security: []
      parameters:
        - name: fileName
          in: path
          description: Stylesheet file name, for example `app.css`
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The stylesheet
          content:
            text/css:
              schema:
                type: string
