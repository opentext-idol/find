pathItems:

  dashboardKeepAlive:
    post:
      summary: Extend the session for a fullscreen dashboard
      description: |
        Touches the HTTP session so that an unattended fullscreen dashboard does not log out,
        and returns the session timeout so the dashboard knows how often to poll.
      operationId: keepDashboardAlive
      tags:
        - dashboards
      responses:
        '200':
          description: Seconds of inactivity after which the session will expire
          content:
            application/json:
              schema:
                type: integer
                format: int32
