components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FINDSESSIONID
      description: |
        Find authenticates browser sessions with a session cookie established by its own login API.  Access is managed
        by request path: `/api/public/` requires the `FindUser` role, `/api/bi/` the `FindBI` role, and `/api/admin/`
        the `FindAdmin` role.  Requests to `/customization/` need no credentials.  A first-time setup user also has
        access to `/api/admin/config/`.

        A deployment may instead be configured for reverse-proxy pre-authentication, in which case the proxy supplies
        the identity and no cookie is involved.
