openapi: "3.0.3"

info:
  version: ${project.version}
  title: Find API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP API of the Find web application, consumed by the Find frontend.
    
    URLs are relative to the servlet context path.  Tags are one per Spring controller.

    Common error responses:
     - 400 Bad Request: a request parameter was missing, malformed or rejected by validation
     - 403 Forbidden: not authenticated, the session has expired, or the caller has insufficient privileges
     - 500 Internal Server Error: unexpected server error, or an IDOL component returned an error

    Error bodies are `ErrorResponse` objects carrying a `uuid` that correlates with the server log.

servers:
  - url: /

security:
  - sessionCookie: []

